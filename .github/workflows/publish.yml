name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tripforge-${{ matrix.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "$IMAGE" ${{ matrix.context }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: docker push "$IMAGE"